[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbus_core"
version = "0.2.0"
description = "Shared core for Ecstasy: features, fusion rules, schemas, Bedrock and Groq clients, ingestion helpers"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "httpx>=0.27",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "rank-bm25>=0.2.2",
  "paho-mqtt>=2.1",
  "tzdata",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nimbus_core*"]

[tool.setuptools.package-data]
nimbus_core = ["*.sql"]
