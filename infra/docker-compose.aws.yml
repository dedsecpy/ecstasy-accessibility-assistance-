# Server overrides for a single EC2 instance. Caddy on 80/443 is the only public entry point.
#   SITE_ADDRESS=<ip-with-dashes>.sslip.io docker compose -f infra/docker-compose.yml -f infra/docker-compose.aws.yml up -d --build
# infra/aws/deploy.sh works out SITE_ADDRESS and runs this for you.
services:
  mosquitto:
    ports: !reset []
  postgres:
    ports: !reset []
  chroma:
    ports: !reset []
  api:
    ports: !reset []
  web:
    build:
      args:
        NEXT_PUBLIC_API_PORT: ""
    ports: !reset []

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS, e.g. 13-234-5-6.sslip.io}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  caddy-data:
  caddy-config:
