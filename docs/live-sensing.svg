<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="820" viewBox="0 0 1700 820" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker>
  </defs>

  <rect width="1700" height="820" fill="#ffffff"/>

  <text x="60" y="66" font-size="30" font-weight="700" fill="#1b1f24">Ecstasy with live sensing: IoT + computer vision</text>
  <text x="60" y="96" font-size="16" fill="#6e7781">Real-time lift data and CCTV, backed by maintenance logs and reports, cross-checked into one decision.</text>

  <g font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.5" text-anchor="middle">
    <text x="130" y="150">SENSE</text>
    <text x="420" y="150">INTERPRET</text>
    <text x="700" y="150">COMBINE</text>
    <text x="960" y="150">CURRENT STATE</text>
    <text x="1220" y="150">DECIDE</text>
    <text x="1500" y="150">ACT</text>
  </g>

  <!-- ================= SENSE ================= -->
  <g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
    <circle cx="130" cy="210" r="30"/>
    <circle cx="130" cy="360" r="30"/>
    <circle cx="130" cy="510" r="30"/>
    <circle cx="130" cy="660" r="30"/>
  </g>
  <g stroke="#57606a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- lift with wifi -->
    <g transform="translate(126,214) scale(0.6)">
      <rect x="-16" y="-24" width="32" height="48" rx="3"/>
      <path d="M-6 -5 L0 -13 L6 -5 Z M-6 5 L0 13 L6 5 Z" fill="#57606a" stroke-width="2"/>
      <path d="M22 -24 A12 12 0 0 1 34 -12 M22 -34 A22 22 0 0 1 44 -12"/>
      <circle cx="23" cy="-13" r="2.5" fill="#57606a" stroke="none"/>
    </g>
    <!-- cctv camera -->
    <g transform="translate(132,360) scale(0.6)">
      <rect x="-24" y="-18" width="36" height="20" rx="3" transform="rotate(-12)"/>
      <path d="M12 -12 L24 -18 V0 L12 -4"/>
      <path d="M-8 2 V16 H-22"/>
    </g>
    <!-- toolbox -->
    <g transform="translate(130,510) scale(0.62)">
      <rect x="-22" y="-8" width="44" height="28" rx="4"/><path d="M-9 -8 V-16 H9 V-8"/><path d="M-22 4 H22"/>
    </g>
    <!-- speech bubble -->
    <g transform="translate(130,660) scale(0.6)">
      <path d="M-26 -22 H26 V12 H-4 L-16 24 V12 H-26 Z"/><path d="M-16 -10 H16 M-16 0 H8"/>
    </g>
  </g>
  <!-- NEW badges -->
  <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="148" y="170" width="40" height="18" rx="9" fill="#bc4c00"/><text x="168" y="183">NEW</text>
    <rect x="148" y="320" width="40" height="18" rx="9" fill="#bc4c00"/><text x="168" y="333">NEW</text>
  </g>
  <g text-anchor="middle">
    <text x="130" y="260" font-size="15" font-weight="700" fill="#1b1f24">Lift sensor (NodeMCU)</text>
    <text x="130" y="277" font-size="12.5" fill="#6e7781">motion, doors, power</text>
    <text x="130" y="410" font-size="15" font-weight="700" fill="#1b1f24">CCTV cameras</text>
    <text x="130" y="427" font-size="12.5" fill="#6e7781">existing, at entrances &amp; paths</text>
    <text x="130" y="560" font-size="15" font-weight="700" fill="#1b1f24">Maintenance logs</text>
    <text x="130" y="577" font-size="12.5" fill="#6e7781">backup if sensor goes silent</text>
    <text x="130" y="710" font-size="15" font-weight="700" fill="#1b1f24">Reports</text>
    <text x="130" y="727" font-size="12.5" fill="#6e7781">visitors &amp; staff</text>
  </g>

  <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#aS)">
    <path d="M162 210 H374"/>
    <path d="M162 360 H374"/>
    <path d="M162 510 C270 510 270 580 374 582"/>
    <path d="M162 660 C270 660 270 592 374 590"/>
  </g>
  <g font-size="12" font-style="italic" fill="#8c959f" text-anchor="middle">
    <text x="268" y="200">Wi-Fi, every 30 s</text>
    <text x="268" y="350">video stays on site</text>
  </g>

  <!-- ================= INTERPRET + COMBINE (green) ================= -->
  <g fill="#eefaf1" stroke="#1a7f37" stroke-width="2">
    <circle cx="420" cy="210" r="42"/>
    <circle cx="420" cy="360" r="42"/>
    <circle cx="420" cy="585" r="42"/>
    <circle cx="700" cy="400" r="52"/>
  </g>
  <g stroke="#1a7f37" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- pulse -->
    <g transform="translate(420,210)"><path d="M-26 0 H-13 L-7 -15 L0 15 L7 -8 L11 0 H26"/></g>
    <!-- eye -->
    <g transform="translate(420,360)"><path d="M-26 0 C-16 -15 16 -15 26 0 C16 15 -16 15 -26 0 Z"/><circle r="7"/></g>
    <!-- documents -->
    <g transform="translate(420,585) scale(0.85)">
      <path d="M-20 -20 V24 H12"/>
      <path d="M-14 -26 H10 L18 -18 V18 H-14 Z" fill="#eefaf1"/>
      <path d="M-6 -12 H8 M-6 -3 H10 M-6 6 H6"/>
    </g>
    <!-- merge -->
    <g transform="translate(700,400)">
      <path d="M-26 -18 C-8 -18 -8 0 6 0 M-26 0 H6 M-26 18 C-8 18 -8 0 6 0 M6 0 H22"/>
      <path d="M15 -7 L23 0 L15 7"/>
    </g>
  </g>
  <g text-anchor="middle">
    <text x="420" y="272" font-size="16" font-weight="700" fill="#1b1f24">Live lift status</text>
    <text x="420" y="290" font-size="12.5" fill="#6e7781">moving, stuck, doors faulty</text>
    <text x="420" y="306" font-size="12.5" fill="#6e7781">no signal = unknown, not "working"</text>

    <text x="420" y="422" font-size="16" font-weight="700" fill="#1b1f24">Computer vision</text>
    <text x="420" y="440" font-size="12.5" fill="#6e7781">gate open? path blocked? seats free?</text>
    <text x="420" y="456" font-size="12.5" fill="#6e7781">runs on site, no faces stored</text>

    <text x="420" y="647" font-size="16" font-weight="700" fill="#1b1f24">LLM reads logs &amp; reports</text>
    <text x="420" y="665" font-size="12.5" fill="#6e7781">turns text into dated facts</text>

    <text x="700" y="476" font-size="17" font-weight="700" fill="#1b1f24">Combine &amp; cross-check</text>
    <text x="700" y="496" font-size="13" fill="#6e7781">newest reliable source wins</text>
    <text x="700" y="513" font-size="13" fill="#6e7781">sources disagree = "verify"</text>
  </g>
  <g stroke="#1a7f37" stroke-width="2.5" fill="none" marker-end="url(#aG)">
    <path d="M462 210 C560 210 560 382 646 384"/>
    <path d="M462 360 C560 360 560 400 646 400"/>
    <path d="M462 585 C560 585 560 420 646 418"/>
    <path d="M752 400 H906"/>
  </g>

  <!-- ================= STATE + DECIDE + ACT (blue) ================= -->
  <g fill="#eef4ff" stroke="#1f6feb" stroke-width="2">
    <circle cx="960" cy="400" r="52"/>
    <circle cx="1220" cy="400" r="52"/>
    <circle cx="1500" cy="280" r="46"/>
    <circle cx="1500" cy="540" r="46"/>
  </g>
  <g stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- traffic light -->
    <g transform="translate(960,400)">
      <rect x="-13" y="-28" width="26" height="56" rx="8"/>
      <circle cx="0" cy="-15" r="6" fill="#1a7f37" stroke="none"/>
      <circle cx="0" cy="0" r="6" fill="#bf8700" stroke="none"/>
      <circle cx="0" cy="15" r="6" fill="#cf222e" stroke="none"/>
    </g>
    <!-- AI chip -->
    <g transform="translate(1220,400)">
      <rect x="-20" y="-20" width="40" height="40" rx="6"/>
      <path d="M-10 -20 V-29 M0 -20 V-29 M10 -20 V-29 M-10 20 V29 M0 20 V29 M10 20 V29 M-20 -10 H-29 M-20 0 H-29 M-20 10 H-29 M20 -10 H29 M20 0 H29 M20 10 H29"/>
      <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb" stroke="none">AI</text>
    </g>
    <!-- pin -->
    <g transform="translate(1500,280) scale(0.9)">
      <path d="M0 30 C-14 14 -22 2 -22 -10 A22 22 0 0 1 22 -10 C22 2 14 14 0 30 Z"/><circle cx="0" cy="-10" r="7"/>
    </g>
    <!-- bell -->
    <g transform="translate(1500,536)">
      <path d="M-16 10 V-4 A16 16 0 0 1 16 -4 V10 L20 16 H-20 Z"/><path d="M-5 21 A5 5 0 0 0 5 21"/>
    </g>
  </g>
  <g text-anchor="middle">
    <text x="960" y="476" font-size="17" font-weight="700" fill="#1b1f24">Live status board</text>
    <text x="960" y="496" font-size="13" fill="#6e7781">status, source, confidence, age</text>

    <text x="1220" y="476" font-size="17" font-weight="700" fill="#1b1f24">RAG + LLM decides</text>
    <text x="1220" y="496" font-size="13" fill="#6e7781">retrieves evidence, writes cited answer</text>

    <text x="1500" y="346" font-size="16" font-weight="700" fill="#1b1f24">Visitor answer</text>
    <text x="1500" y="364" font-size="12.5" fill="#6e7781">route + what to check first</text>

    <text x="1500" y="606" font-size="16" font-weight="700" fill="#1b1f24">Staff alert</text>
    <text x="1500" y="624" font-size="12.5" fill="#6e7781">lift fault, locked gate, blocked path</text>
  </g>
  <g font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="1405" y="376" width="44" height="20" rx="10" fill="#1a7f37"/><text x="1427" y="390">GO</text>
    <rect x="1455" y="376" width="72" height="20" rx="10" fill="#bf8700"/><text x="1491" y="390">CAUTION</text>
    <rect x="1533" y="376" width="62" height="20" rx="10" fill="#cf222e"/><text x="1564" y="390">NO-GO</text>
  </g>
  <g stroke="#1f6feb" stroke-width="2.5" fill="none" marker-end="url(#aB)">
    <path d="M1012 400 H1166"/>
    <path d="M1220 288 V344"/>
    <path d="M1268 382 L1456 298"/>
    <path d="M1268 418 L1456 522"/>
  </g>
  <text x="1220" y="276" font-size="13.5" font-style="italic" fill="#1f6feb" text-anchor="middle">visitor's question</text>

  <!-- ================= example ================= -->
  <rect x="60" y="752" width="1580" height="44" rx="10" fill="#fffbea" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="850" y="780" font-size="14" fill="#5c3c00" text-anchor="middle"><tspan font-weight="700">Example: </tspan>sensor reports lift stuck between floors  &#8594;  log: engineer booked for 6 Oct  &#8594;  Lift: out of service (high confidence)  &#8594;  upstairs lecture: <tspan font-weight="700" fill="#cf222e">NO-GO</tspan>, facilities alerted</text>
</svg>
