<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>

  <rect width="1600" height="780" fill="#ffffff"/>

  <!-- Title -->
  <text x="80" y="78" font-size="30" font-weight="700" fill="#1b1f24">Ecstasy: how it works</text>
  <text x="80" y="108" font-size="16" fill="#6e7781">Turns a venue's dated records into an honest, personal answer before you travel.</text>

  <text x="80" y="178" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.5">VISITOR JOURNEY</text>
  <text x="80" y="508" font-size="12" font-weight="700" fill="#8c959f" letter-spacing="1.5">KEEPING IT TRUE</text>

  <!-- ================= Main flow ================= -->
  <g stroke="#8c959f" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M266 300 H432"/>
    <path d="M566 300 H732"/>
    <path d="M866 300 H1032"/>
    <path d="M1166 300 H1332"/>
  </g>

  <g fill="#eef4ff" stroke="#1f6feb" stroke-width="2">
    <circle cx="200" cy="300" r="56"/>
    <circle cx="500" cy="300" r="56"/>
    <circle cx="800" cy="300" r="56"/>
    <circle cx="1100" cy="300" r="56"/>
    <circle cx="1400" cy="300" r="56"/>
  </g>

  <!-- 1 Visitor: wheelchair user -->
  <g transform="translate(200,300)" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="2" cy="-27" r="6" fill="#1f6feb" stroke="none"/>
    <path d="M0 -17 L-2 3 L16 3 L22 22"/>
    <path d="M-1 -8 L14 -8"/>
    <circle cx="-4" cy="14" r="16"/>
  </g>
  <!-- 2 Ask: phone -->
  <g transform="translate(500,300)" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-17" y="-30" width="34" height="60" rx="7"/>
    <path d="M-5 21 H5"/>
    <text x="0" y="8" text-anchor="middle" font-size="26" font-weight="700" fill="#1f6feb" stroke="none">?</text>
  </g>
  <!-- 3 Retrieve: document + magnifier -->
  <g transform="translate(800,300)" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 -28 H6 L16 -18 V20 H-20 Z"/>
    <path d="M6 -28 V-18 H16"/>
    <path d="M-12 -12 H2 M-12 -3 H0"/>
    <circle cx="10" cy="12" r="11" fill="#eef4ff"/>
    <path d="M18 20 L27 29"/>
  </g>
  <!-- 4 Reason: AI chip -->
  <g transform="translate(1100,300)" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-20" y="-20" width="40" height="40" rx="6"/>
    <path d="M-10 -20 V-29 M0 -20 V-29 M10 -20 V-29 M-10 20 V29 M0 20 V29 M10 20 V29 M-20 -10 H-29 M-20 0 H-29 M-20 10 H-29 M20 -10 H29 M20 0 H29 M20 10 H29"/>
    <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700" fill="#1f6feb" stroke="none">AI</text>
  </g>
  <!-- 5 Answer: map pin -->
  <g transform="translate(1400,300)" stroke="#1f6feb" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 30 C-14 14 -22 2 -22 -10 A22 22 0 0 1 22 -10 C22 2 14 14 0 30 Z"/>
    <circle cx="0" cy="-10" r="7"/>
  </g>

  <!-- step numbers -->
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="160" cy="260" r="14" fill="#1b1f24"/><text x="160" y="265">1</text>
    <circle cx="460" cy="260" r="14" fill="#1b1f24"/><text x="460" y="265">2</text>
    <circle cx="760" cy="260" r="14" fill="#1b1f24"/><text x="760" y="265">3</text>
    <circle cx="1060" cy="260" r="14" fill="#1b1f24"/><text x="1060" y="265">4</text>
    <circle cx="1360" cy="260" r="14" fill="#1b1f24"/><text x="1360" y="265">5</text>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
    <text x="200" y="390" font-size="19" font-weight="700" fill="#1b1f24">Visitor</text>
    <text x="200" y="414" font-size="14" fill="#6e7781">needs, event, arrival time</text>

    <text x="500" y="390" font-size="19" font-weight="700" fill="#1b1f24">Ask</text>
    <text x="500" y="414" font-size="14" fill="#6e7781">"Can I reach my seat?"</text>

    <text x="800" y="390" font-size="19" font-weight="700" fill="#1b1f24">Retrieve (RAG)</text>
    <text x="800" y="414" font-size="14" fill="#6e7781">newest, most trusted records</text>

    <text x="1100" y="390" font-size="19" font-weight="700" fill="#1b1f24">Reason (LLM)</text>
    <text x="1100" y="414" font-size="14" fill="#6e7781">cites every claim, flags stale info</text>

    <text x="1400" y="390" font-size="19" font-weight="700" fill="#1b1f24">Answer</text>
    <text x="1400" y="414" font-size="14" fill="#6e7781">route + what to check first</text>
  </g>
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="1302" y="430" width="44" height="22" rx="11" fill="#1a7f37"/><text x="1324" y="445">GO</text>
    <rect x="1354" y="430" width="74" height="22" rx="11" fill="#bf8700"/><text x="1391" y="445">CAUTION</text>
    <rect x="1436" y="430" width="62" height="22" rx="11" fill="#cf222e"/><text x="1467" y="445">NO-GO</text>
  </g>

  <!-- ================= Feedback loop ================= -->
  <g fill="#eefaf1" stroke="#1a7f37" stroke-width="2">
    <circle cx="500" cy="610" r="56"/>
    <circle cx="800" cy="610" r="56"/>
    <circle cx="1100" cy="610" r="56"/>
  </g>

  <!-- Report: speech bubble -->
  <g transform="translate(500,610)" stroke="#1a7f37" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-26 -22 H26 V12 H-4 L-16 24 V12 H-26 Z"/>
    <path d="M-16 -10 H16 M-16 0 H8"/>
  </g>
  <!-- Knowledge base: database -->
  <g transform="translate(800,610)" stroke="#1a7f37" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="-20" rx="22" ry="8"/>
    <path d="M-22 -20 V20 A22 8 0 0 0 22 20 V-20"/>
    <path d="M-22 0 A22 8 0 0 0 22 0"/>
  </g>
  <!-- Listing health: clipboard check -->
  <g transform="translate(1100,610)" stroke="#1a7f37" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-20" y="-24" width="40" height="52" rx="5"/>
    <rect x="-9" y="-30" width="18" height="10" rx="3" fill="#eefaf1"/>
    <path d="M-10 4 L-3 11 L11 -4"/>
  </g>

  <g text-anchor="middle">
    <text x="500" y="700" font-size="19" font-weight="700" fill="#1b1f24">Report</text>
    <text x="500" y="724" font-size="14" fill="#6e7781">visitors &amp; staff, in plain words</text>

    <text x="800" y="700" font-size="19" font-weight="700" fill="#1b1f24">Knowledge base</text>
    <text x="800" y="724" font-size="14" fill="#6e7781">audit, lift log, notes, reports</text>

    <text x="1100" y="700" font-size="19" font-weight="700" fill="#1b1f24">Listing health</text>
    <text x="1100" y="724" font-size="14" fill="#6e7781">flags wrong claims for staff</text>
  </g>

  <!-- loop arrows -->
  <g stroke="#1a7f37" stroke-width="2.5" fill="none" marker-end="url(#arrowG)">
    <path d="M566 610 H732"/>
    <path d="M866 610 H1032"/>
    <path d="M800 552 V432"/>
    <path d="M200 430 C200 560 300 610 432 610" stroke-dasharray="7 5"/>
  </g>
  <g font-size="13" fill="#1a7f37" font-style="italic" text-anchor="middle">
    <text x="649" y="598">new dated facts</text>
    <text x="949" y="598">check claims</text>
    <text x="846" y="496">evidence</text>
    <text x="214" y="548" text-anchor="end">after the visit</text>
  </g>
</svg>
